name: Python Code Quality Gate

on:
  push:
    branches: [ main, task-* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Linting Frameworks
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest

    - name: Run Syntax & Style Checks
      run: |
        # Stop the build if there are critical Python syntax or definition errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat all style warnings gracefully without breaking the build
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics